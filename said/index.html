<title>Said Al-Ganbousi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow card — logo tile, bilingual name, three big tap targets */
:root{
  --bg:#f6f4ee; --card:#ffffff; --fg:#1f1a22; --muted:#6b6370;
  --yellow:#f2d21b; --red:#c8321a; --plum:#8a4a6b; --line:#e7e2d8;
  --font:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17131a; --card:#221c26; --fg:#f4eef6; --muted:#a99fb0; --line:#362d3c; --red:#e2553b; --plum:#b97a9b; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17131a; --card:#221c26; --fg:#f4eef6; --muted:#a99fb0; --line:#362d3c; --red:#e2553b; --plum:#b97a9b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.logo{background:#fff;display:flex;justify-content:center;padding:20px 20px 4px}
.logo img{width:72%;max-width:260px;height:auto}
.stripe{height:6px;background:linear-gradient(90deg,var(--red) 0 33%,var(--yellow) 33% 66%,var(--plum) 66%)}
.who{padding:22px 20px 6px;text-align:center}
.who h1{margin:0;font-size:1.7rem;font-weight:700;text-wrap:balance}
.who .en{margin:4px 0 0;font-size:1rem;color:var(--muted);letter-spacing:.02em}
.who .co{margin:12px 0 0;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--plum);font-weight:500}
.actions{display:grid;gap:10px;padding:18px 20px 24px}
.btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
  color:var(--fg);text-decoration:none;min-width:0}
.btn:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.btn .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff}
.btn .tx{min-width:0;display:grid;gap:2px}
.btn .lb{font-size:.8rem;color:var(--muted)}
.btn .val{font-size:1.02rem;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.call .ic{background:var(--red)} .mail .ic{background:var(--plum)}
.save{background:var(--yellow);border-color:var(--yellow);color:#1f1a22;justify-content:center;font-weight:700;font-size:1.02rem;margin-top:4px}
.save .lb2{font-weight:400;opacity:.75}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
